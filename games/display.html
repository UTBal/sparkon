<!doctype html>
<html lang="en" class="tv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Big screen · SparkON</title>
<link rel="icon" href="/icons/favicon.ico" sizes="any">
<link rel="stylesheet" href="/games/css/games.css">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/games/css/standard-cards.css">
</head>
<body>
<header class="app">
  <img class="logo" src="/games/assets/logo-original.svg" alt="SparkON" width="160" height="40">
  <span class="badge" id="conn">Connecting…</span>
</header>
<main class="wrap wide">
  <section id="pair" class="panel">
    <p class="badge">TV display · read-only</p>
    <h1>Pair this screen</h1>
    <p>On the host phone, enter this code under <strong>Pair TV</strong>. No Google sign-in needed on the TV.</p>
    <div class="big-code" id="pairCode" aria-live="polite">····</div>
    <p class="muted" id="pairStatus">Waiting for host…</p>
  </section>
  <section id="board" class="hide" aria-live="polite">
    <p class="badge" id="phaseBadge"></p>
    <h1 id="title"></h1>
    <p id="prompt"></p>
    <div id="extra" class="panel"></div>
    <div id="scores"></div>
  </section>
</main>
<div id="reconnect" class="reconnecting hide" role="status">Reconnecting…</div>
<script type="module" src="/games/js/display-app.js"></script>
</body>
</html>
